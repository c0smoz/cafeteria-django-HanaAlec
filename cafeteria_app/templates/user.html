<h1>Liste des étudiants</h1>

<table>
<tr><th>Nom</th><th>Email</th><th>Crédit</th><th>Cotisant</th></tr>

{% for student in students %}
<tr>
    <td>{{ student.name }}</td>
    <td>{{ student.email }}</td>
    <td>{{ student.credit }} €</td>
    <td>
        {% if student.is_subscriber %}
            Oui
        {% else %}
            Non
        {% endif %}
    </td>
</tr>
{% endfor %}
</table>
